name: Tests

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Clonar repositorio
        run: |
          git clone https://github.com/${{ github.repository }}.git .

      - name: Configurar entorno e instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-pytest python3-fastapi python3-httpx

      - name: Ejecutar tests con pytest
        run: python3 -m pytest -v
